name: Security gate
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JevForge/jev-security-sentinel@v0
        with:
          sarif_path: reports/semgrep.sarif
          trivy_path: reports/trivy.json
          environment: production
          gate_scope: changed
          jev_provider: vercel-ai-gateway
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
