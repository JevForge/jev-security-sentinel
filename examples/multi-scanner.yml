name: Multi-scanner gate
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: sentinel
        uses: JevForge/jev-security-sentinel@v0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          VERACODE_API_ID: ${{ secrets.VERACODE_API_ID }}
          VERACODE_API_KEY: ${{ secrets.VERACODE_API_KEY }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          semgrep_path: |
            reports/semgrep.json
            reports/semgrep-ci.json
          snyk_path: reports/snyk*.json
          veracode_path: reports/veracode.json
          sarif_path: reports/**/*.sarif
          fetch_ghas: 'true'
          fetch_snyk: 'false'
          environment: production
          comment_on_github: 'true'
          create_check_run: 'true'
          review_mode: fail

      - name: Risk summary
        if: always()
        run: echo '${{ steps.sentinel.outputs.risk_summary }}'
